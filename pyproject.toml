[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "guard-cli"
version = "0.1.0rc1"
description = "Graph-powered safety layer for AI coding agents built on FalkorDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "falkordb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.0.0",
]

[project.scripts]
guard = "guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
